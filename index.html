<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Invictus Track</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f7f8; }
      #root { height: 100%; }
      .app-shell { height: 100vh; }
      .app-header { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem); }
      @supports (height: 100dvh) { .app-shell { height: 100dvh; } }
    </style>
  </head>
  <body class="bg-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
