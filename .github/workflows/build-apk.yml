name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Add GPS Permissions
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Add WhatsApp map sharing support
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text()
          activity_pattern = re.compile(
              r'(<activity\b[^>]*android:name="\.MainActivity"[^>]*>)(.*?)(</activity>)',
              re.DOTALL
          )
          match = activity_pattern.search(manifest)
          if not match:
              raise SystemExit("Could not find the generated MainActivity in AndroidManifest.xml")

          activity_body = match.group(2)
          if 'android.intent.action.SEND' not in activity_body:
              share_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
          '''
              activity_body += share_filter
              manifest = manifest[:match.start(2)] + activity_body + manifest[match.end(2):]
              manifest_path.write_text(manifest)

          package_dir = Path("android/app/src/main/java/com/invictus/tracker")
          package_dir.mkdir(parents=True, exist_ok=True)
          plugin_path = package_dir / "SharedLocationPlugin.java"
          plugin_path.write_text('''package com.invictus.tracker;

          import android.content.Intent;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "SharedLocation")
          public class SharedLocationPlugin extends Plugin {
              private JSObject pendingShare;

              @Override
              public void load() {
                  pendingShare = extractSharedText(getActivity().getIntent());
              }

              @PluginMethod
              public void getPendingShare(PluginCall call) {
                  JSObject result = pendingShare;
                  pendingShare = null;
                  call.resolve(result == null ? new JSObject() : result);
              }

              @Override
              protected void handleOnNewIntent(Intent intent) {
                  JSObject shared = extractSharedText(intent);
                  if (shared == null) return;
                  pendingShare = shared;
                  notifyListeners("sharedText", shared, true);
              }

              private JSObject extractSharedText(Intent intent) {
                  if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return null;
                  String text = intent.getStringExtra(Intent.EXTRA_TEXT);
                  if (text == null || text.trim().isEmpty()) return null;
                  JSObject result = new JSObject();
                  result.put("text", text.trim());
                  return result;
              }
          }
          ''')

          main_activity_path = package_dir / "MainActivity.java"
          main_activity_path.write_text('''package com.invictus.tracker;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SharedLocationPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          ''')
          PY

      - name: Configure Android Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/invictus-release.jks

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_config = '''
              signingConfigs {
                  invictusRelease {
                      storeFile file("invictus-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing_config,
                  1
              )

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode ' + os.environ["GITHUB_RUN_NUMBER"],
              text,
              count=1
          )

          if re.search(r'(?m)^\s*debug\s*\{', text):
              text = re.sub(
                  r'(^\s*debug\s*\{)',
                  r'\1\n            signingConfig signingConfigs.invictusRelease',
                  text,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              text = text.replace(
                  "buildTypes {",
                  '''buildTypes {
                  debug {
                      signingConfig signingConfigs.invictusRelease
                  }''',
                  1
              )

          path.write_text(text)
          PY

      - name: Build APK via Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvictusTrack-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
